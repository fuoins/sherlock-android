name: Build arm64 APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK，不用第三方 setup action（它会尝试安装已下架的 tools 包）
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "Installed packages:"
          "$SDKMANAGER" --list-installed | head -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Build arm64-v8a debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect arm64 APK
        run: |
          mkdir -p out
          echo "APK files produced:"
          find app/build/outputs/apk -name '*.apk' -print
          APK=$(find app/build/outputs/apk -name '*.apk' | grep -i 'arm64' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          fi
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" out/sherlock-mobile-arm64-v8a-debug.apk
          ls -lh out/

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-mobile-arm64-v8a
          path: out/sherlock-mobile-arm64-v8a-debug.apk
          if-no-files-found: error
